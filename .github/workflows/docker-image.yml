name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag bitwarden-sdk-server:0.5.1_alpine_ajay
